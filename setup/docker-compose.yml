services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      # host 5555 -> container 5678. ngrok must forward to 5555.
      - "5555:5678"
    environment:
      - WEBHOOK_URL=https://YOUR-N8N-DOMAIN/
      - N8N_EDITOR_BASE_URL=https://YOUR-N8N-DOMAIN/
      # Controls when the Sunday Schedule Trigger fires
      - GENERIC_TIMEZONE=Africa/Casablanca
      - TZ=Africa/Casablanca
      # Store binary data (receipt photos) on disk instead of in memory/DB
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      # Lets community nodes be used as AI agent tools
      - N8N_COMMUNITY_PACKAGE_ALLOW_TOOL_USAGE=true
    volumes:
      # C:\dev\n8n\data, outside OneDrive
      - ./data:/home/node/.n8n

  # HTML -> PDF converter (headless Chromium) for the Proposal Engine.
  # No published port: only n8n can reach it, at http://gotenberg:3000
  # (both services share the compose network, where the service name is the hostname).
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: gotenberg
    restart: unless-stopped
